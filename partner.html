<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>提携先 売上報告フォーム｜ピュアナ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap" style="padding-bottom:40px">
  <header class="hero">
    <div class="shop" data-shop>エアコンクリーニング ピュアナ</div>
    <h1>提携先 売上報告フォーム</h1>
    <p>提携先・協力業者さま専用の窓口です。作業1件ごとに送信してください。提携コードは発行元からお知らせしたものを入力してください。</p>
    <div class="test-banner" id="testBanner" hidden>テストモード：送信先（GAS_URL）が未設定のため、送信しても保存されません。</div>
  </header>

  <form id="partnerForm" novalidate>
    <section class="card">
      <h2><span class="step">1</span>報告者</h2>
      <div class="field"><label for="partnerCode">提携コード<span class="req">必須</span></label><input type="password" id="partnerCode" name="partnerCode" autocomplete="off" required></div>
      <div class="row2">
        <div class="field"><label for="staff">担当者名<span class="req">必須</span></label><input type="text" id="staff" name="staff" required maxlength="40"></div>
        <div class="field"><label for="email">受付メールの送り先<span class="opt">任意</span></label><input type="email" id="email" name="email" autocomplete="email"></div>
      </div>
      <label class="choice"><input type="checkbox" id="remember">この端末に提携コードと担当者名を保存する</label>
    </section>

    <section class="card">
      <h2><span class="step">2</span>作業と売上</h2>
      <div class="row2">
        <div class="field"><label for="workDate">作業日<span class="req">必須</span></label><input type="date" id="workDate" name="workDate" required></div>
        <div class="field"><label for="pref">お客様の都道府県<span class="opt">任意</span></label><select id="pref" name="pref"><option value="">選択してください</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="work">作業内容<span class="req">必須</span></label>
          <select id="work" name="work" required><option value="">選択してください</option><option>エアコンクリーニング</option><option>エアコンクリーニング＋オプション</option><option>浴室クリーニング</option><option>キッチンクリーニング</option><option>洗濯機クリーニング</option><option>その他</option></select></div>
        <div class="field"><label for="units">台数<span class="opt">任意</span></label><input type="number" id="units" name="units" min="0" max="50" inputmode="numeric"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="amount">売上金額（税込・円）<span class="req">必須</span></label><input type="number" id="amount" name="amount" min="0" step="1" inputmode="numeric" required></div>
        <div class="field"><label for="fee">手数料・紹介料（円）<span class="opt">任意</span></label><input type="number" id="fee" name="fee" min="0" step="1" inputmode="numeric"></div>
      </div>
      <div class="field"><label for="note">備考<span class="opt">任意</span></label><textarea id="note" name="note" maxlength="1000" placeholder="お客様の名字、案件番号など"></textarea></div>
      <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

      <button type="submit" class="submit" id="submitBtn">売上を報告する</button>
      <p class="error-box" id="errorBox" role="alert"></p>
    </section>
  </form>

  <section class="card done" id="doneView" hidden>
    <div class="big">売上報告を受け付けました</div>
    <p>受付番号 <span class="id" id="doneId"></span></p>
    <button type="button" class="submit" id="againBtn" style="max-width:320px;margin:16px auto 0">続けて別の作業を報告する</button>
  </section>

  <footer><div data-shop>エアコンクリーニング ピュアナ</div></footer>
</div>

<script src="assets/config.js"></script>
<script src="assets/partner.js"></script>
</body>
</html>
